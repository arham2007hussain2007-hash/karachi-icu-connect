<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;

    sessionStorage.setItem(
      "redirect",
      path + search + hash
    );

    window.location.replace("/karachi-icu-connect/");
  </script>
</head>
<body>
</body>
</html>
